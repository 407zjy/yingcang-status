<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="refresh" content="60">
<title>影仓 · 实时工作状态看板</title><style>
body{font-family:-apple-system,"PingFang SC","Noto Sans CJK SC",sans-serif;background:#f5f5f4;margin:0;padding:24px;color:#1c1917}
h1{font-size:22px;margin:0 0 4px}.sub{color:#78716c;font-size:13px;margin-bottom:16px}
.sum{display:flex;gap:10px;margin-bottom:20px}.sum span{padding:6px 12px;border-radius:999px;font-size:13px;color:#fff}
.g{background:#16a34a}.x{background:#9ca3af}.a{background:#f59e0b}.r{background:#dc2626}
h2{font-size:15px;margin:18px 0 8px;color:#44403c}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.card{background:#fff;border-radius:10px;padding:12px 14px;border-left:6px solid;box-shadow:0 1px 2px #0001}
.card b{font-size:15px}.st{display:inline-block;font-size:12px;color:#fff;padding:2px 8px;border-radius:6px;margin-left:6px}
.task{margin:8px 0;font-size:13px;min-height:18px}.t{font-size:12px;color:#78716c}
.stale{outline:2px dashed #dc2626}.stale .t{color:#dc2626;font-weight:600}
</style></head><body>
<h1>影仓 · 实时工作状态看板</h1><div class="sub" id="sub"></div><div class="sum" id="sum"></div><div id="board"></div>
<script>
const DATA=[{"岗位": "DOT 总经理工作助理", "汇报给": "Jinyong", "状态": "等待安排", "当前任务": "—", "更新时间": "2026-10-15 07:20"}, {"岗位": "产品总监", "汇报给": "Jinyong", "状态": "进行中", "当前任务": "跟进任务详情页复刻和素材第4屏修改，3项待Jinyong决定", "更新时间": "2026-10-14 20:39"}, {"岗位": "项目经理", "汇报给": "Jinyong", "状态": "等待安排", "当前任务": "—", "更新时间": "2026-10-14 19:47"}, {"岗位": "COO 首席运营官", "汇报给": "Jinyong", "状态": "进行中", "当前任务": "核实待 Jinyong 决定的事项是否已由产品总监汇总上报", "更新时间": "2026-10-14 20:38"}, {"岗位": "产品经理", "汇报给": "产品总监", "状态": "已完成", "当前任务": "关联素材规则补充6处已入库，待 Jinyong 确认", "更新时间": "2026-10-18 02:35"}, {"岗位": "设计总监", "汇报给": "产品总监", "状态": "进行中", "当前任务": "关联素材模块：带 UX 出方案和线框", "更新时间": "2026-10-18 02:06"}, {"岗位": "研发主管", "汇报给": "产品总监", "状态": "等待安排", "当前任务": "线框阶段：等各模块定稿前做技术可行性和风险审查", "更新时间": "2026-10-15 08:35"}, {"岗位": "测试总监", "汇报给": "产品总监", "状态": "等待安排", "当前任务": "线框阶段，等模块定稿前做验收检查", "更新时间": "2026-10-15 08:35"}, {"岗位": "功能测试工程师", "汇报给": "测试总监", "状态": "进行中", "当前任务": "关联素材验收：规则部分已交产品总监审核，等线框补界面部分", "更新时间": "2026-10-18 02:30"}, {"岗位": "UX 交互设计师", "汇报给": "设计总监", "状态": "进行中", "当前任务": "关联素材：流程 v3.1 修订后开线框", "更新时间": "2026-10-18 11:20"}, {"岗位": "UXR 用户研究员", "汇报给": "设计总监", "状态": "已完成", "当前任务": "关联素材用户问题清单已交设计总监审", "更新时间": "2026-10-18 02:35"}];
const C={'进行中':'g','已完成':'x','等待安排':'a','卡住':'r'},HEX={g:'#16a34a',x:'#9ca3af',a:'#f59e0b',r:'#dc2626'};
const now=Date.now();
function ago(s){const m=Math.floor((now-new Date(s.replace(' ','T')+':00+08:00'))/6e4);if(m<1)return'刚刚';if(m<60)return m+' 分钟前';const h=Math.floor(m/60);return h<24?h+' 小时 '+(m%60)+' 分钟前':Math.floor(h/24)+' 天前'}
const fmt=new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',dateStyle:'short',timeStyle:'short'});
document.getElementById('sub').textContent='页面打开时间 '+fmt.format(now)+'（北京时间）· 每 60 秒自动刷新 · 超过 2 小时未更新的成员会标红虚线框';
const cnt={};DATA.forEach(r=>cnt[r.状态]=(cnt[r.状态]||0)+1);
document.getElementById('sum').innerHTML=Object.keys(C).map(k=>`<span class="${C[k]}">${k} ${cnt[k]||0}</span>`).join('');
const groups={};DATA.forEach(r=>(groups[r.汇报给]=groups[r.汇报给]||[]).push(r));
const order=Object.keys(groups).sort((a,b)=>(a==='Jinyong'?-1:b==='Jinyong'?1:0));
document.getElementById('board').innerHTML=order.map(g=>`<h2>汇报给：${g}</h2><div class="grid">`+groups[g].map(r=>{const c=C[r.状态]||'x',st=(now-new Date(r.更新时间.replace(' ','T')+':00+08:00'))>7.2e6;
return `<div class="card${st?' stale':''}" style="border-color:${HEX[c]}"><b>${r.岗位}</b><span class="st ${c}">${r.状态}</span><div class="task">${r.当前任务}</div><div class="t">更新于 ${r.更新时间}（${ago(r.更新时间)}）${st?' · 超过 2 小时未更新':''}</div></div>`}).join('')+'</div>').join('');
</script></body></html>
